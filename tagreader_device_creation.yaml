blueprint:
  name: "SmInt MQTT Device Creator"
  description: "Erzeugt dynamisch MQTT-Sensoren. Einheit, Geräteklasse und Hersteller können frei definiert werden."
  domain: automation

  input:
    # --- Allgemeine Reader & Sensor Konfiguration ---
    reader_id:
      name: Reader ID (für MQTT Topic)
      description: "Beispiel: tr_k_01_kwh"
      default: "tr_k_01_kwh"
      selector:
        text: {}
        
    sensor_name:
      name: MQTT Sensor Name
      description: "Der Name des Sensors in Home Assistant (z.B. 03_Mikrowelle Stromverbrauch)"
      default: "03_Mikrowelle Stromverbrauch"
      selector:
        text: {}

    unit_of_measurement:
      name: Einheit (Unit of Measurement)
      description: "z.B. kWh, W, °C. Lass das Feld komplett leer, wenn der Sensor keine Einheit haben soll."
      default: "kWh"
      selector:
        text: {}

    device_class:
      name: Geräteklasse (Device Class)
      description: "z.B. energy, power. Lass das Feld komplett leer, wenn keine Geräteklasse benötigt wird."
      default: "energy"
      selector:
        text: {}

    manufacturer:
      name: Hersteller (Manufacturer)
      description: "Der Karte, die im MQTT-Gerät hinterlegt wird ( Karte 001, Karte 002)."
      default: "Karte 001"
      selector:
        text: {}

    # --- TAG 1 Konfiguration ---
    tag1_boolean:
      name: Tag 001 Boolean (Trigger)
      selector: { entity: { domain: input_boolean } }
    tag1_text:
      name: Tag 001 Experiment Speicher (input_text)
      selector: { entity: { domain: input_text } }
    tag1_number:
      name: Tag 001 kWh Speicher (input_number)
      selector: { entity: { domain: input_number } }

    # --- TAG 2 Konfiguration ---
    tag2_boolean:
      name: Tag 002 Boolean (Trigger)
      selector: { entity: { domain: input_boolean } }
    tag2_text:
      name: Tag 002 Experiment Speicher (input_text)
      selector: { entity: { domain: input_text } }
    tag2_number:
      name: Tag 002 kWh Speicher (input_number)
      selector: { entity: { domain: input_number } }

    # --- TAG 3 Konfiguration ---
    tag3_boolean:
      name: Tag 003 Boolean (Trigger)
      selector: { entity: { domain: input_boolean } }
    tag3_text:
      name: Tag 003 Experiment Speicher (input_text)
      selector: { entity: { domain: input_text } }
    tag3_number:
      name: Tag 003 kWh Speicher (input_number)
      selector: { entity: { domain: input_number } }

mode: parallel

trigger:
  # --- TRIGGER TAG 1 ---
  - platform: state
    entity_id: !input tag1_boolean
    from: "off"
    to: "on"
    id: "Tag1_ON"
  - platform: state
    entity_id: !input tag1_boolean
    from: "on"
    to: "off"
    id: "Tag1_OFF"

  # --- TRIGGER TAG 2 ---
  - platform: state
    entity_id: !input tag2_boolean
    from: "off"
    to: "on"
    id: "Tag2_ON"
  - platform: state
    entity_id: !input tag2_boolean
    from: "on"
    to: "off"
    id: "Tag2_OFF"

  # --- TRIGGER TAG 3 ---
  - platform: state
    entity_id: !input tag3_boolean
    from: "off"
    to: "on"
    id: "Tag3_ON"
  - platform: state
    entity_id: !input tag3_boolean
    from: "on"
    to: "off"
    id: "Tag3_OFF"

action:
  # Variablen für die Templates definieren
  - variables:
      reader_id: !input reader_id
      sensor_name: !input sensor_name
      uom: !input unit_of_measurement
      d_class: !input device_class
      mfg: !input manufacturer
      
      tag1_txt: !input tag1_text
      tag1_num: !input tag1_number
      
      tag2_txt: !input tag2_text
      tag2_num: !input tag2_number
      
      tag3_txt: !input tag3_text
      tag3_num: !input tag3_number

  - choose:
      # ==========================================
      # TAG 1
      # ==========================================
      - conditions:
          - condition: trigger
            id: "Tag1_ON"
        sequence:
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag1_txt) }}/{{ reader_id }}/config"
              payload: >-
                {
                  "name": "{{ sensor_name }}",
                  "state_topic": "homeassistant/sensor/{{ states(tag1_txt) }}/{{ reader_id }}/state",
                  "unit_of_measurement": "{{ uom }}",
                  {% if d_class != "" %}
                  "device_class": "{{ d_class }}",
                  {% endif %}
                  "state_class": "total",
                  "unique_id": "{{ states(tag1_txt) }}_{{ reader_id }}",
                  "device": {
                    "identifiers": ["{{ states(tag1_txt) }}"],
                    "name": "{{ states(tag1_txt) }}",
                    "manufacturer": "{{ mfg }}",
                    "model": "SmInt",  
                    "model_id": "test123",
                    "serial_number": "12345",
                    "hw_version": "1.0",
                    "sw_version": "2105.1.0",
                    "configuration_url": "https://example.com/experiment_config"
                  }
                }
              qos: 0
              retain: true

      - conditions:
          - condition: trigger
            id: "Tag1_OFF"
        sequence:
          - delay:
              seconds: 1
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag1_txt) }}/{{ reader_id }}/state"
              payload: "{{ states(tag1_num) }}"
              qos: 0
              retain: true

      # ==========================================
      # TAG 2
      # ==========================================
      - conditions:
          - condition: trigger
            id: "Tag2_ON"
        sequence:
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag2_txt) }}/{{ reader_id }}/config"
              payload: >-
                {
                  "name": "{{ sensor_name }}",
                  "state_topic": "homeassistant/sensor/{{ states(tag2_txt) }}/{{ reader_id }}/state",
                  "unit_of_measurement": "{{ uom }}",
                  {% if d_class != "" %}
                  "device_class": "{{ d_class }}",
                  {% endif %}
                  "state_class": "total",
                  "unique_id": "{{ states(tag2_txt) }}_{{ reader_id }}",
                  "device": {
                    "identifiers": ["{{ states(tag2_txt) }}"],
                    "name": "{{ states(tag2_txt) }}",
                    "manufacturer": "{{ mfg }}",
                    "model": "SmInt",  
                    "model_id": "test123",
                    "serial_number": "12345",
                    "hw_version": "1.0",
                    "sw_version": "2105.1.0",
                    "configuration_url": "https://example.com/experiment_config"
                  }
                }
              qos: 0
              retain: true

      - conditions:
          - condition: trigger
            id: "Tag2_OFF"
        sequence:
          - delay:
              seconds: 1
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag2_txt) }}/{{ reader_id }}/state"
              payload: "{{ states(tag2_num) }}"
              qos: 0
              retain: true

      # ==========================================
      # TAG 3
      # ==========================================
      - conditions:
          - condition: trigger
            id: "Tag3_ON"
        sequence:
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag3_txt) }}/{{ reader_id }}/config"
              payload: >-
                {
                  "name": "{{ sensor_name }}",
                  "state_topic": "homeassistant/sensor/{{ states(tag3_txt) }}/{{ reader_id }}/state",
                  "unit_of_measurement": "{{ uom }}",
                  {% if d_class != "" %}
                  "device_class": "{{ d_class }}",
                  {% endif %}
                  "state_class": "total",
                  "unique_id": "{{ states(tag3_txt) }}_{{ reader_id }}",
                  "device": {
                    "identifiers": ["{{ states(tag3_txt) }}"],
                    "name": "{{ states(tag3_txt) }}",
                    "manufacturer": "{{ mfg }}",
                    "model": "SmInt",  
                    "model_id": "test123",
                    "serial_number": "12345",
                    "hw_version": "1.0",
                    "sw_version": "2105.1.0",
                    "configuration_url": "https://example.com/experiment_config"
                  }
                }
              qos: 0
              retain: true

      - conditions:
          - condition: trigger
            id: "Tag3_OFF"
        sequence:
          - delay:
              seconds: 1
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag3_txt) }}/{{ reader_id }}/state"
              payload: "{{ states(tag3_num) }}"
              qos: 0
              retain: true