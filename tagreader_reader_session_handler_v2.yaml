          default: []
          selector: { entity: { domain: sensor } }
        tag3_text:
          name: Tag 003 Experiment Name (input_text)
          default: []
          selector: { entity: { domain: input_text } }
        tag3_manufacturer:
          name: Tag 003 Hersteller (Manufacturer)
          default: "Karte 003"
          selector: { text: {} }

    # --- Karte 4-10 (optional, gleiches Schema) ---
