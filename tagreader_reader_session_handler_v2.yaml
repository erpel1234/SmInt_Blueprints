blueprint:
  name: "SmInt Reader Session Handler v2 (bis zu 10 Karten, bis zu 10 Zusatzsensoren)"
  description: >
    Erweiterte Version von tagreader_reader_session_handler.yaml: unterstützt
    bis zu 10 Karten-Slots und bis zu 10 optionale Zusatzsensoren pro Reader.
    Karte 1 ist Pflicht, alles weitere (Karte 2-10, alle Zusatzsensoren) ist
    optional - einfach leer lassen, was nicht gebraucht wird.

    Zusatzsensoren: wird ein "Meter-Entity" angegeben, verhält sich der Sensor
    wie der primäre kWh-Sensor (beim Einchecken auf 0 kalibrieren, beim
    Auschecken aufaddieren). Bleibt das Meter-Feld leer, wird stattdessen der
    aktuelle Wert der Werte-Entity beim Auschecken 1:1 übernommen (Passthrough,
    z.B. für vorberechnete Gas-/Wasserverbrauchssensoren).
  domain: automation

  input:
    # --- Allgemein / primärer Sensor ---
    display_text:
      name: Display Input Text (dieser Reader)
      selector:
        entity:
          domain: input_text
    esphome_in:
      name: ESPHome IN Action
      default: []
      selector:
        action: {}
    esphome_out:
      name: ESPHome OUT Action
      default: []
      selector:
        action: {}
    reader_id:
      name: Reader ID (für MQTT Topic, z.B. tr_k_01_kwh)
      default: "tr_k_01_kwh"
      selector:
        text: {}
    sensor_name:
      name: MQTT Sensor Name (primärer kWh-Sensor)
      default: "05_Stromverbrauch (Reader)"
      selector:
        text: {}
    unit_of_measurement:
      name: Einheit (primärer Sensor)
      default: "kWh"
      selector:
        text: {}
    device_class:
      name: Geräteklasse (primärer Sensor)
      default: "energy"
      selector:
        text: {}

    # --- Karte 1 (Pflicht) ---
    karte1_section:
      name: Karte 001
      icon: mdi:card-account-details
      collapsed: false
      input:
        tag1_boolean:
          name: Tag 001 Boolean (Trigger)
          selector: { entity: { domain: input_boolean } }
        mc_tag1_boolean:
          name: MC Tag 001 Boolean
          selector: { entity: { domain: input_boolean } }
        tag1_number:
          name: Tag 001 kWh Speicher (input_number)
          selector: { entity: { domain: input_number } }
        tag1_meter:
          name: Tag 001 Utility Meter (sensor)
          selector: { entity: { domain: sensor } }
        tag1_text:
          name: Tag 001 Experiment Name (input_text)
          selector: { entity: { domain: input_text } }
        tag1_manufacturer:
          name: Tag 001 Hersteller (Manufacturer)
          default: "Karte 001"
          selector: { text: {} }

    # --- Karte 2 (optional) ---
    karte2_section:
      name: Karte 002 (optional)
      icon: mdi:card-account-details
      collapsed: false
      input:
        tag2_boolean:
          name: Tag 002 Boolean (Trigger)
          default: []
          selector: { entity: { domain: input_boolean } }
        mc_tag2_boolean:
          name: MC Tag 002 Boolean
          default: []
          selector: { entity: { domain: input_boolean } }
        tag2_number:
          name: Tag 002 kWh Speicher (input_number)
          default: []
          selector: { entity: { domain: input_number } }
        tag2_meter:
          name: Tag 002 Utility Meter (sensor)
          default: []
          selector: { entity: { domain: sensor } }
        tag2_text:
          name: Tag 002 Experiment Name (input_text)
          default: []
          selector: { entity: { domain: input_text } }
        tag2_manufacturer:
          name: Tag 002 Hersteller (Manufacturer)
          default: "Karte 002"
          selector: { text: {} }

    # --- Karte 3 (optional) ---
    karte3_section:
      name: Karte 003 (optional)
      icon: mdi:card-account-details
      collapsed: false
      input:
        tag3_boolean:
