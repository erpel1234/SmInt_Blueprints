mode: parallel

trigger:
  - platform: state
    entity_id: !input tag1_boolean
    id: "Tag1"
  - platform: state
    entity_id: !input tag2_boolean
    id: "Tag2"
  - platform: state
    entity_id: !input tag3_boolean
    id: "Tag3"
  - platform: state
    entity_id: !input tag4_boolean
    id: "Tag4"
  - platform: state
    entity_id: !input tag5_boolean
    id: "Tag5"
  - platform: state
    entity_id: !input tag6_boolean
    id: "Tag6"
  - platform: state
    entity_id: !input tag7_boolean
    id: "Tag7"
  - platform: state
    entity_id: !input tag8_boolean
    id: "Tag8"
  - platform: state
    entity_id: !input tag9_boolean
    id: "Tag9"
  - platform: state
    entity_id: !input tag10_boolean
    id: "Tag10"

condition: []

action:
  - variables:
      reader_id_v: !input reader_id
      sensor_name_v: !input sensor_name
      uom_v: !input unit_of_measurement
      d_class_v: !input device_class

      tag_defs:
        - { boolean: !input tag1_boolean, mc_boolean: !input mc_tag1_boolean, number: !input tag1_number, meter: !input tag1_meter, text: !input tag1_text, mfg: !input tag1_manufacturer, label: "001" }
        - { boolean: !input tag2_boolean, mc_boolean: !input mc_tag2_boolean, number: !input tag2_number, meter: !input tag2_meter, text: !input tag2_text, mfg: !input tag2_manufacturer, label: "002" }
        - { boolean: !input tag3_boolean, mc_boolean: !input mc_tag3_boolean, number: !input tag3_number, meter: !input tag3_meter, text: !input tag3_text, mfg: !input tag3_manufacturer, label: "003" }
        - { boolean: !input tag4_boolean, mc_boolean: !input mc_tag4_boolean, number: !input tag4_number, meter: !input tag4_meter, text: !input tag4_text, mfg: !input tag4_manufacturer, label: "004" }
        - { boolean: !input tag5_boolean, mc_boolean: !input mc_tag5_boolean, number: !input tag5_number, meter: !input tag5_meter, text: !input tag5_text, mfg: !input tag5_manufacturer, label: "005" }
        - { boolean: !input tag6_boolean, mc_boolean: !input mc_tag6_boolean, number: !input tag6_number, meter: !input tag6_meter, text: !input tag6_text, mfg: !input tag6_manufacturer, label: "006" }
        - { boolean: !input tag7_boolean, mc_boolean: !input mc_tag7_boolean, number: !input tag7_number, meter: !input tag7_meter, text: !input tag7_text, mfg: !input tag7_manufacturer, label: "007" }
        - { boolean: !input tag8_boolean, mc_boolean: !input mc_tag8_boolean, number: !input tag8_number, meter: !input tag8_meter, text: !input tag8_text, mfg: !input tag8_manufacturer, label: "008" }
        - { boolean: !input tag9_boolean, mc_boolean: !input mc_tag9_boolean, number: !input tag9_number, meter: !input tag9_meter, text: !input tag9_text, mfg: !input tag9_manufacturer, label: "009" }
        - { boolean: !input tag10_boolean, mc_boolean: !input mc_tag10_boolean, number: !input tag10_number, meter: !input tag10_meter, text: !input tag10_text, mfg: !input tag10_manufacturer, label: "010" }

      sensor_defs_raw:
        - { value_entity: !input extra1_value_entity, meter_entity: !input extra1_meter_entity, name: !input extra1_name, unit: !input extra1_unit, device_class: !input extra1_device_class, topic_id: !input extra1_topic_id }
        - { value_entity: !input extra2_value_entity, meter_entity: !input extra2_meter_entity, name: !input extra2_name, unit: !input extra2_unit, device_class: !input extra2_device_class, topic_id: !input extra2_topic_id }
        - { value_entity: !input extra3_value_entity, meter_entity: !input extra3_meter_entity, name: !input extra3_name, unit: !input extra3_unit, device_class: !input extra3_device_class, topic_id: !input extra3_topic_id }
        - { value_entity: !input extra4_value_entity, meter_entity: !input extra4_meter_entity, name: !input extra4_name, unit: !input extra4_unit, device_class: !input extra4_device_class, topic_id: !input extra4_topic_id }
        - { value_entity: !input extra5_value_entity, meter_entity: !input extra5_meter_entity, name: !input extra5_name, unit: !input extra5_unit, device_class: !input extra5_device_class, topic_id: !input extra5_topic_id }
        - { value_entity: !input extra6_value_entity, meter_entity: !input extra6_meter_entity, name: !input extra6_name, unit: !input extra6_unit, device_class: !input extra6_device_class, topic_id: !input extra6_topic_id }
        - { value_entity: !input extra7_value_entity, meter_entity: !input extra7_meter_entity, name: !input extra7_name, unit: !input extra7_unit, device_class: !input extra7_device_class, topic_id: !input extra7_topic_id }
        - { value_entity: !input extra8_value_entity, meter_entity: !input extra8_meter_entity, name: !input extra8_name, unit: !input extra8_unit, device_class: !input extra8_device_class, topic_id: !input extra8_topic_id }
        - { value_entity: !input extra9_value_entity, meter_entity: !input extra9_meter_entity, name: !input extra9_name, unit: !input extra9_unit, device_class: !input extra9_device_class, topic_id: !input extra9_topic_id }
        - { value_entity: !input extra10_value_entity, meter_entity: !input extra10_meter_entity, name: !input extra10_name, unit: !input extra10_unit, device_class: !input extra10_device_class, topic_id: !input extra10_topic_id }

  - variables:
      this_tag: "{{ tag_defs | selectattr('boolean', 'eq', trigger.entity_id) | first }}"
      sensor_defs: "{{ sensor_defs_raw | selectattr('topic_id', 'ne', '') | list }}"

  - choose:
      # ==========================================
      # EINCHECKEN (Tag-Boolean -> on)
      # ==========================================
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'on' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_state(this_tag.mc_boolean, 'off') }}"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: "{{ this_tag.mc_boolean }}"
          - action: utility_meter.calibrate
            target:
              entity_id: "{{ this_tag.meter }}"
            data:
              value: 0
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(this_tag.text) }}/{{ reader_id_v }}/config"
              payload: >-
                {
                  "name": "{{ sensor_name_v }}",
                  "state_topic": "homeassistant/sensor/{{ states(this_tag.text) }}/{{ reader_id_v }}/state",
                  "unit_of_measurement": "{{ uom_v }}",
                  {% if d_class_v != "" %}
                  "device_class": "{{ d_class_v }}",
                  {% endif %}
                  "state_class": "total",
                  "unique_id": "{{ states(this_tag.text) }}_{{ reader_id_v }}",
                  "device": {
                    "identifiers": ["{{ states(this_tag.text) }}"],
                    "name": "{{ states(this_tag.text) }}",
                    "manufacturer": "{{ this_tag.mfg }}",
                    "model": "SmInt",
                    "model_id": "test123",
                    "serial_number": "12345",
                    "hw_version": "1.0",
                    "sw_version": "2105.1.0",
                    "configuration_url": "https://example.com/experiment_config"
                  }
                }
              qos: 0
              retain: true

          - repeat:
              for_each: "{{ sensor_defs }}"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ repeat.item.meter_entity != [] }}"
                  then:
                    - action: utility_meter.calibrate
                      target:
                        entity_id: "{{ repeat.item.meter_entity }}"
                      data:
                        value: 0
                - action: mqtt.publish
                  data:
                    topic: "homeassistant/sensor/{{ states(this_tag.text) }}/{{ repeat.item.topic_id }}/config"
                    payload: >-
                      {
                        "name": "{{ repeat.item.name }}",
                        "state_topic": "homeassistant/sensor/{{ states(this_tag.text) }}/{{ repeat.item.topic_id }}/state",
                        "unit_of_measurement": "{{ repeat.item.unit }}",
                        {% if repeat.item.device_class != "" %}
                        "device_class": "{{ repeat.item.device_class }}",
                        {% endif %}
                        "unique_id": "{{ states(this_tag.text) }}_{{ repeat.item.topic_id }}",
                        "device": { "identifiers": ["{{ states(this_tag.text) }}"] }
                      }
                    qos: 0
                    retain: true

          - sequence: !input esphome_in

      # ==========================================
      # AUSCHECKEN (Tag-Boolean -> off)
      # ==========================================
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'off' }}"
        sequence:
          - action: input_number.set_value
            target:
              entity_id: "{{ this_tag.number }}"
            data:
              value: >
                {{ states(this_tag.number) | float(0) + states(this_tag.meter) | float(0) }}
          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(this_tag.text) }}/{{ reader_id_v }}/state"
              payload: "{{ states(this_tag.number) }}"
              qos: 0
              retain: true

          - repeat:
              for_each: "{{ sensor_defs }}"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ repeat.item.meter_entity != [] }}"
                  then:
                    - action: input_number.set_value
                      target:
                        entity_id: "{{ repeat.item.value_entity }}"
                      data:
                        value: >
                          {{ states(repeat.item.value_entity) | float(0) + states(repeat.item.meter_entity) | float(0) }}
                - delay: { seconds: 1 }
                - action: mqtt.publish
                  data:
                    topic: "homeassistant/sensor/{{ states(this_tag.text) }}/{{ repeat.item.topic_id }}/state"
                    payload: "{{ states(repeat.item.value_entity) }}"
                    qos: 0
                    retain: true

          - sequence: !input esphome_out

  # ==========================================
  # DISPLAY UPDATE (läuft immer danach, für alle 10 Slots)
  # ==========================================
  - service: input_text.set_value
    target:
      entity_id: !input display_text
    data:
      value: >-
        {% set ns = namespace(logged_in=[]) %}
        {% for t in tag_defs %}
          {% if t.boolean and is_state(t.boolean, 'on') %}
            {% set ns.logged_in = ns.logged_in + [t.label] %}
          {% endif %}
        {% endfor %}
        {% if ns.logged_in | length == 0 %}
          Bitte Karte scannen!
        {% else %}
          Karten eingeloggt: {{ ns.logged_in | join(', ') }}
        {% endif %}
