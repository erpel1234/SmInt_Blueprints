blueprint:
  name: "SmInt Reader Session Handler v2 (bis zu 10 Karten, Sensoren pro Karte als Liste)"
  description: >
    Erweiterte Version von tagreader_reader_session_handler.yaml: unterstützt
    bis zu 10 Karten-Slots. Karte 1 ist Pflicht, Karte 2-10 ist optional -
    einfach leer lassen, was nicht gebraucht wird.

    Jede Karte hat ihr eigenes Feld "Zusätzliche Sensoren" - eine Liste mit
    beliebig vielen Einträgen (kein festes Limit). Jeder Listeneintrag braucht:
    value_entity, name, unit, topic_id. Optional: meter_entity (wenn gesetzt,
    verhält sich der Sensor wie der primäre kWh-Sensor - kalibrieren beim
    Einchecken, aufaddieren beim Auschecken; value_entity muss dann ein
    input_number sein), device_class (optional). Ohne meter_entity wird der
    aktuelle Wert von value_entity beim Auschecken 1:1 übernommen (Passthrough,
    z.B. für vorberechnete Gas-/Wasserverbrauchssensoren).

    Beispiel für das Listenfeld einer Karte:
      - value_entity: sensor.argon_verbrauch_tag001
        name: "07_Argon Verbrauch"
        unit: "ml"
        topic_id: "argon"
      - value_entity: input_number.stickstoff_summe_tag001
        meter_entity: sensor.stickstoff_meter_tag001
        name: "08_Stickstoff Verbrauch"
        unit: "ml"
        topic_id: "stickstoff"
  domain: automation

  input:
    # --- Allgemein / primärer Sensor ---
    display_text:
      name: Display Input Text (dieser Reader)
      selector:
        entity:
          domain: input_text
    esphome_in:
      name: ESPHome IN Action
      default: []
      selector:
        action: {}
    esphome_out:
      name: ESPHome OUT Action
      default: []
      selector:
        action: {}
    reader_id:
      name: Reader ID (für MQTT Topic, z.B. tr_k_01_kwh)
      default: "tr_k_01_kwh"
      selector:
        text: {}
    sensor_name:
      name: MQTT Sensor Name (primärer kWh-Sensor)
      default: "05_Stromverbrauch (Reader)"
      selector:
        text: {}
    unit_of_measurement:
      name: Einheit (primärer Sensor)
      default: "kWh"
      selector:
        text: {}
    device_class:
      name: Geräteklasse (primärer Sensor)
      default: "energy"
      selector:
        text: {}

    # --- Karte 1 (Pflicht) ---
    karte1_section:
      name: Karte 001
      icon: mdi:card-account-details
      collapsed: false
      input:
        tag1_boolean:
          name: Tag 001 Boolean (Trigger)
          selector: { entity: { domain: input_boolean } }
        mc_tag1_boolean:
          name: MC Tag 001 Boolean
          selector: { entity: { domain: input_boolean } }
        tag1_number:
          name: Tag 001 kWh Speicher (input_number)
          selector: { entity: { domain: input_number } }
        tag1_meter:
          name: Tag 001 Utility Meter (sensor)
          selector: { entity: { domain: sensor } }
        tag1_text:
          name: Tag 001 Experiment Name (input_text)
          selector: { entity: { domain: input_text } }
        tag1_manufacturer:
          name: Tag 001 Hersteller (Manufacturer)
          default: "Karte 001"
          selector: { text: {} }
        tag1_sensors:
          name: "Tag 001 - Zusätzliche Sensoren (Liste, optional)"
          description: "Siehe Blueprint-Beschreibung oben für das Format."
          default: []
          selector:
            object: {}

    # --- Karte 2 (optional) ---
    karte2_section:
      name: Karte 002 (optional)
      icon: mdi:card-account-details
      collapsed: false
      input:
        tag2_boolean:
          name: Tag 002 Boolean (Trigger)
          default: []
          selector: { entity: { domain: input_boolean } }
        mc_tag2_boolean:
          name: MC Tag 002 Boolean
          default: []
          selector: { entity: { domain: input_boolean } }
        tag2_number:
          name: Tag 002 kWh Speicher (input_number)
          default: []
          selector: { entity: { domain: input_number } }
        tag2_meter:
          name: Tag 002 Utility Meter (sensor)
          default: []
          selector: { entity: { domain: sensor } }
        tag2_text:
          name: Tag 002 Experiment Name (input_text)
          default: []
          selector: { entity: { domain: input_text } }
        tag2_manufacturer:
          name: Tag 002 Hersteller (Manufacturer)
          default: "Karte 002"
          selector: { text: {} }
        tag2_sensors:
          name: "Tag 002 - Zusätzliche Sensoren (Liste, optional)"
          description: "Siehe Blueprint-Beschreibung oben für das Format."
          default: []
          selector:
            object: {}

    # --- Karte 3 (optional) ---
    karte3_section:
      name: Karte 003 (optional)
      icon: mdi:card-account-details
      collapsed: false
      input:
        tag3_boolean:
          name: Tag 003 Boolean (Trigger)
          default: []
          selector: { entity: { domain: input_boolean } }
        mc_tag3_boolean:
          name: MC Tag 003 Boolean
          default: []
          selector: { entity: { domain: input_boolean } }
        tag3_number:
          name: Tag 003 kWh Speicher (input_number)
          default: []
          selector: { entity: { domain: input_number } }
        tag3_meter:
          name: Tag 003 Utility Meter (sensor)
          default: []
          selector: { entity: { domain: sensor } }
        tag3_text:
          name: Tag 003 Experiment Name (input_text)
          default: []
          selector: { entity: { domain: input_text } }
        tag3_manufacturer:
          name: Tag 003 Hersteller (Manufacturer)
          default: "Karte 003"
          selector: { text: {} }
        tag3_sensors:
          name: "Tag 003 - Zusätzliche Sensoren (Liste, optional)"
          description: "Siehe Blueprint-Beschreibung oben für das Format."
          default: []
          selector:
            object: {}

    # --- Karte 4-10 (optional, gleiches Schema) ---
    karte4_section:
      name: Karte 004 (optional)
      icon: mdi:card-account-details
      collapsed: true
      input:
        tag4_boolean: { name: Tag 004 Boolean (Trigger), default: [], selector: { entity: { domain: input_boolean } } }
        mc_tag4_boolean: { name: MC Tag 004 Boolean, default: [], selector: { entity: { domain: input_boolean } } }
        tag4_number: { name: Tag 004 kWh Speicher (input_number), default: [], selector: { entity: { domain: input_number } } }
        tag4_meter: { name: Tag 004 Utility Meter (sensor), default: [], selector: { entity: { domain: sensor } } }
        tag4_text: { name: Tag 004 Experiment Name (input_text), default: [], selector: { entity: { domain: input_text } } }
        tag4_manufacturer: { name: Tag 004 Hersteller (Manufacturer), default: "Karte 004", selector: { text: {} } }
        tag4_sensors: { name: "Tag 004 - Zusätzliche Sensoren (Liste, optional)", default: [], selector: { object: {} } }

    karte5_section:
      name: Karte 005 (optional)
      icon: mdi:card-account-details
      collapsed: true
      input:
        tag5_boolean: { name: Tag 005 Boolean (Trigger), default: [], selector: { entity: { domain: input_boolean } } }
        mc_tag5_boolean: { name: MC Tag 005 Boolean, default: [], selector: { entity: { domain: input_boolean } } }
        tag5_number: { name: Tag 005 kWh Speicher (input_number), default: [], selector: { entity: { domain: input_number } } }
        tag5_meter: { name: Tag 005 Utility Meter (sensor), default: [], selector: { entity: { domain: sensor } } }
        tag5_text: { name: Tag 005 Experiment Name (input_text), default: [], selector: { entity: { domain: input_text } } }
        tag5_manufacturer: { name: Tag 005 Hersteller (Manufacturer), default: "Karte 005", selector: { text: {} } }
        tag5_sensors: { name: "Tag 005 - Zusätzliche Sensoren (Liste, optional)", default: [], selector: { object: {} } }

    karte6_section:
      name: Karte 006 (optional)
      icon: mdi:card-account-details
      collapsed: true
      input:
        tag6_boolean: { name: Tag 006 Boolean (Trigger), default: [], selector: { entity: { domain: input_boolean } } }
        mc_tag6_boolean: { name: MC Tag 006 Boolean, default: [], selector: { entity: { domain: input_boolean } } }
        tag6_number: { name: Tag 006 kWh Speicher (input_number), default: [], selector: { entity: { domain: input_number } } }
        tag6_meter: { name: Tag 006 Utility Meter (sensor), default: [], selector: { entity: { domain: sensor } } }
        tag6_text: { name: Tag 006 Experiment Name (input_text), default: [], selector: { entity: { domain: input_text } } }
        tag6_manufacturer: { name: Tag 006 Hersteller (Manufacturer), default: "Karte 006", selector: { text: {} } }
        tag6_sensors: { name: "Tag 006 - Zusätzliche Sensoren (Liste, optional)", default: [], selector: { object: {} } }

    karte7_section:
      name: Karte 007 (optional)
      icon: mdi:card-account-details
      collapsed: true
      input:
        tag7_boolean: { name: Tag 007 Boolean (Trigger), default: [], selector: { entity: { domain: input_boolean } } }
        mc_tag7_boolean: { name: MC Tag 007 Boolean, default: [], selector: { entity: { domain: input_boolean } } }
        tag7_number: { name: Tag 007 kWh Speicher (input_number), default: [], selector: { entity: { domain: input_number } } }
        tag7_meter: { name: Tag 007 Utility Meter (sensor), default: [], selector: { entity: { domain: sensor } } }
        tag7_text: { name: Tag 007 Experiment Name (input_text), default: [], selector: { entity: { domain: input_text } } }
        tag7_manufacturer: { name: Tag 007 Hersteller (Manufacturer), default: "Karte 007", selector: { text: {} } }
        tag7_sensors: { name: "Tag 007 - Zusätzliche Sensoren (Liste, optional)", default: [], selector: { object: {} } }

    karte8_section:
      name: Karte 008 (optional)
      icon: mdi:card-account-details
      collapsed: true
      input:
        tag8_boolean: { name: Tag 008 Boolean (Trigger), default: [], selector: { entity: { domain: input_boolean } } }
        mc_tag8_boolean: { name: MC Tag 008 Boolean, default: [], selector: { entity: { domain: input_boolean } } }
        tag8_number: { name: Tag 008 kWh Speicher (input_number), default: [], selector: { entity: { domain: input_number } } }
        tag8_meter: { name: Tag 008 Utility Meter (sensor), default: [], selector: { entity: { domain: sensor } } }
        tag8_text: { name: Tag 008 Experiment Name (input_text), default: [], selector: { entity: { domain: input_text } } }
        tag8_manufacturer: { name: Tag 008 Hersteller (Manufacturer), default: "Karte 008", selector: { text: {} } }
        tag8_sensors: { name: "Tag 008 - Zusätzliche Sensoren (Liste, optional)", default: [], selector: { object: {} } }

    karte9_section:
      name: Karte 009 (optional)
      icon: mdi:card-account-details
