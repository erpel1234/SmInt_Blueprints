        tag10_number: { name: Tag 010 kWh Speicher (input_number), default: [], selector: { entity: { domain: input_number } } }
        tag10_meter: { name: Tag 010 Utility Meter (sensor), default: [], selector: { entity: { domain: sensor } } }
        tag10_text: { name: Tag 010 Experiment Name (input_text), default: [], selector: { entity: { domain: input_text } } }
        tag10_manufacturer: { name: Tag 010 Hersteller (Manufacturer), default: "Karte 010", selector: { text: {} } }
        tag10_sensors: { name: "Tag 010 - Zusätzliche Sensoren (Liste, optional)", default: [], selector: { object: {} } }

mode: parallel

trigger:
  - platform: state
    entity_id: !input tag1_boolean
    id: "Tag1"
  - platform: state
    entity_id: !input tag2_boolean
    id: "Tag2"
  - platform: state
    entity_id: !input tag3_boolean
    id: "Tag3"
  - platform: state
    entity_id: !input tag4_boolean
    id: "Tag4"
  - platform: state
    entity_id: !input tag5_boolean
    id: "Tag5"
  - platform: state
    entity_id: !input tag6_boolean
    id: "Tag6"
  - platform: state
    entity_id: !input tag7_boolean
    id: "Tag7"
  - platform: state
    entity_id: !input tag8_boolean
    id: "Tag8"
  - platform: state
    entity_id: !input tag9_boolean
    id: "Tag9"
  - platform: state
    entity_id: !input tag10_boolean
    id: "Tag10"

condition: []

action:
  - variables:
      reader_id_v: !input reader_id
      sensor_name_v: !input sensor_name
      uom_v: !input unit_of_measurement
      d_class_v: !input device_class

      tag_defs:
        - { boolean: !input tag1_boolean, mc_boolean: !input mc_tag1_boolean, number: !input tag1_number, meter: !input tag1_meter, text: !input tag1_text, mfg: !input tag1_manufacturer, label: "001", sensors: !input tag1_sensors }
        - { boolean: !input tag2_boolean, mc_boolean: !input mc_tag2_boolean, number: !input tag2_number, meter: !input tag2_meter, text: !input tag2_text, mfg: !input tag2_manufacturer, label: "002", sensors: !input tag2_sensors }
        - { boolean: !input tag3_boolean, mc_boolean: !input mc_tag3_boolean, number: !input tag3_number, meter: !input tag3_meter, text: !input tag3_text, mfg: !input tag3_manufacturer, label: "003", sensors: !input tag3_sensors }
        - { boolean: !input tag4_boolean, mc_boolean: !input mc_tag4_boolean, number: !input tag4_number, meter: !input tag4_meter, text: !input tag4_text, mfg: !input tag4_manufacturer, label: "004", sensors: !input tag4_sensors }
        - { boolean: !input tag5_boolean, mc_boolean: !input mc_tag5_boolean, number: !input tag5_number, meter: !input tag5_meter, text: !input tag5_text, mfg: !input tag5_manufacturer, label: "005", sensors: !input tag5_sensors }
        - { boolean: !input tag6_boolean, mc_boolean: !input mc_tag6_boolean, number: !input tag6_number, meter: !input tag6_meter, text: !input tag6_text, mfg: !input tag6_manufacturer, label: "006", sensors: !input tag6_sensors }
        - { boolean: !input tag7_boolean, mc_boolean: !input mc_tag7_boolean, number: !input tag7_number, meter: !input tag7_meter, text: !input tag7_text, mfg: !input tag7_manufacturer, label: "007", sensors: !input tag7_sensors }
        - { boolean: !input tag8_boolean, mc_boolean: !input mc_tag8_boolean, number: !input tag8_number, meter: !input tag8_meter, text: !input tag8_text, mfg: !input tag8_manufacturer, label: "008", sensors: !input tag8_sensors }
        - { boolean: !input tag9_boolean, mc_boolean: !input mc_tag9_boolean, number: !input tag9_number, meter: !input tag9_meter, text: !input tag9_text, mfg: !input tag9_manufacturer, label: "009", sensors: !input tag9_sensors }
        - { boolean: !input tag10_boolean, mc_boolean: !input mc_tag10_boolean, number: !input tag10_number, meter: !input tag10_meter, text: !input tag10_text, mfg: !input tag10_manufacturer, label: "010", sensors: !input tag10_sensors }

  - variables:
      this_tag: "{{ tag_defs | selectattr('boolean', 'eq', trigger.entity_id) | first }}"

  - variables:
      sensor_defs: "{{ this_tag.sensors | default([]) | selectattr('topic_id', 'defined') | list }}"

  - choose:
      # ==========================================
      # EINCHECKEN (Tag-Boolean -> on)
      # ==========================================
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'on' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_state(this_tag.mc_boolean, 'off') }}"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: "{{ this_tag.mc_boolean }}"
          - action: utility_meter.calibrate
            target:
              entity_id: "{{ this_tag.meter }}"
            data:
              value: 0
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(this_tag.text) }}/{{ reader_id_v }}/config"
              payload: >-
                {
                  "name": "{{ sensor_name_v }}",
                  "state_topic": "homeassistant/sensor/{{ states(this_tag.text) }}/{{ reader_id_v }}/state",
                  "unit_of_measurement": "{{ uom_v }}",
                  {% if d_class_v != "" %}
                  "device_class": "{{ d_class_v }}",
                  {% endif %}
                  "state_class": "total",
                  "unique_id": "{{ states(this_tag.text) }}_{{ reader_id_v }}",
                  "device": {
                    "identifiers": ["{{ states(this_tag.text) }}"],
                    "name": "{{ states(this_tag.text) }}",
                    "manufacturer": "{{ this_tag.mfg }}",
                    "model": "SmInt",
                    "model_id": "test123",
                    "serial_number": "12345",
                    "hw_version": "1.0",
                    "sw_version": "2105.1.0",
                    "configuration_url": "https://example.com/experiment_config"
                  }
                }
              qos: 0
              retain: true

          - repeat:
              for_each: "{{ sensor_defs }}"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ repeat.item.meter_entity is defined and repeat.item.meter_entity }}"
                  then:
                    - action: utility_meter.calibrate
                      target:
                        entity_id: "{{ repeat.item.meter_entity }}"
                      data:
                        value: 0
                - action: mqtt.publish
                  data:
                    topic: "homeassistant/sensor/{{ states(this_tag.text) }}/{{ repeat.item.topic_id }}/config"
                    payload: >-
                      {
                        "name": "{{ repeat.item.name }}",
                        "state_topic": "homeassistant/sensor/{{ states(this_tag.text) }}/{{ repeat.item.topic_id }}/state",
                        "unit_of_measurement": "{{ repeat.item.unit }}",
                        {% if repeat.item.device_class is defined and repeat.item.device_class %}
                        "device_class": "{{ repeat.item.device_class }}",
                        {% endif %}
                        "unique_id": "{{ states(this_tag.text) }}_{{ repeat.item.topic_id }}",
                        "device": { "identifiers": ["{{ states(this_tag.text) }}"] }
                      }
                    qos: 0
                    retain: true

          - sequence: !input esphome_in

      # ==========================================
      # AUSCHECKEN (Tag-Boolean -> off)
      # ==========================================
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'off' }}"
        sequence:
          - action: input_number.set_value
            target:
              entity_id: "{{ this_tag.number }}"
            data:
              value: >
                {{ states(this_tag.number) | float(0) + states(this_tag.meter) | float(0) }}
          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(this_tag.text) }}/{{ reader_id_v }}/state"
              payload: "{{ states(this_tag.number) }}"
              qos: 0
              retain: true

          - repeat:
              for_each: "{{ sensor_defs }}"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ repeat.item.meter_entity is defined and repeat.item.meter_entity }}"
                  then:
                    - action: input_number.set_value
                      target:
                        entity_id: "{{ repeat.item.value_entity }}"
                      data:
                        value: >
                          {{ states(repeat.item.value_entity) | float(0) + states(repeat.item.meter_entity) | float(0) }}
                - delay: { seconds: 1 }
                - action: mqtt.publish
                  data:
                    topic: "homeassistant/sensor/{{ states(this_tag.text) }}/{{ repeat.item.topic_id }}/state"
                    payload: "{{ states(repeat.item.value_entity) }}"
                    qos: 0
                    retain: true

          - sequence: !input esphome_out

  # ==========================================
  # DISPLAY UPDATE (läuft immer danach, für alle 10 Slots)
  # ==========================================
  - service: input_text.set_value
    target:
      entity_id: !input display_text
    data:
      value: >-
        {% set ns = namespace(logged_in=[]) %}
        {% for t in tag_defs %}
          {% if t.boolean and is_state(t.boolean, 'on') %}
            {% set ns.logged_in = ns.logged_in + [t.label] %}
          {% endif %}
        {% endfor %}
        {% if ns.logged_in | length == 0 %}
          Bitte Karte scannen!
        {% else %}
          Karten eingeloggt:{{ '\n' }}{{ ns.logged_in | join(', ') }}
        {% endif %}
