      input:
        tag9_boolean: { name: Tag 009 Boolean (Trigger), default: [], selector: { entity: { domain: input_boolean } } }
        mc_tag9_boolean: { name: MC Tag 009 Boolean, default: [], selector: { entity: { domain: input_boolean } } }
        tag9_number: { name: Tag 009 kWh Speicher (input_number), default: [], selector: { entity: { domain: input_number } } }
        tag9_meter: { name: Tag 009 Utility Meter (sensor), default: [], selector: { entity: { domain: sensor } } }
        tag9_text: { name: Tag 009 Experiment Name (input_text), default: [], selector: { entity: { domain: input_text } } }
        tag9_manufacturer: { name: Tag 009 Hersteller (Manufacturer), default: "Karte 009", selector: { text: {} } }
        tag9_sensors: { name: "Tag 009 - Zusätzliche Sensoren (Liste, optional)", default: [], selector: { object: {} } }

