        r2_tag10_boolean: { name: Reader 2 → Tag 010 Boolean, default: [], selector: { entity: { filter: [{ domain: input_boolean }] } } }

mode: queued
max: 25

trigger:
  - platform: state
    entity_id: !input reader_mc
    id: "mc"
  - platform: state
    entity_id: !input reader_1
    id: "r1"
  - platform: state
    entity_id: !input reader_2
    id: "r2"

condition: []

action:
  - variables:
      cards:
        - { uid: !input tag_1_uid,  mc: !input mc_tag1_boolean,  r1: !input r1_tag1_boolean,  r2: !input r2_tag1_boolean }
        - { uid: !input tag_2_uid,  mc: !input mc_tag2_boolean,  r1: !input r1_tag2_boolean,  r2: !input r2_tag2_boolean }
        - { uid: !input tag_3_uid,  mc: !input mc_tag3_boolean,  r1: !input r1_tag3_boolean,  r2: !input r2_tag3_boolean }
        - { uid: !input tag_4_uid,  mc: !input mc_tag4_boolean,  r1: !input r1_tag4_boolean,  r2: !input r2_tag4_boolean }
        - { uid: !input tag_5_uid,  mc: !input mc_tag5_boolean,  r1: !input r1_tag5_boolean,  r2: !input r2_tag5_boolean }
        - { uid: !input tag_6_uid,  mc: !input mc_tag6_boolean,  r1: !input r1_tag6_boolean,  r2: !input r2_tag6_boolean }
        - { uid: !input tag_7_uid,  mc: !input mc_tag7_boolean,  r1: !input r1_tag7_boolean,  r2: !input r2_tag7_boolean }
        - { uid: !input tag_8_uid,  mc: !input mc_tag8_boolean,  r1: !input r1_tag8_boolean,  r2: !input r2_tag8_boolean }
        - { uid: !input tag_9_uid,  mc: !input mc_tag9_boolean,  r1: !input r1_tag9_boolean,  r2: !input r2_tag9_boolean }
        - { uid: !input tag_10_uid, mc: !input mc_tag10_boolean, r1: !input r1_tag10_boolean, r2: !input r2_tag10_boolean }

  - variables:
      scanned: "{{ trigger.to_state.state | default('', true) }}"

  # Leere / ungültige Reader-States ignorieren (sonst würde ein leerer UID-Slot matchen)
  - condition: template
    value_template: "{{ scanned not in ['', 'unknown', 'unavailable', 'None', 'none'] }}"

  - variables:
      hit: "{{ cards | selectattr('uid', 'defined') | selectattr('uid', 'eq', scanned) | list }}"

  - condition: template
    value_template: "{{ hit | length > 0 }}"

  - variables:
      # trigger.id ist 'mc' / 'r1' / 'r2' und zugleich der Schlüssel im Karten-Dict
      target_boolean: "{{ hit[0].get(trigger.id, '') }}"

  # Nicht konfigurierte Zuordnungen sind [] (leerer Entity-Selector) statt String -> überspringen
  - condition: template
    value_template: "{{ target_boolean is string and target_boolean | length > 0 }}"

  - action: input_boolean.toggle
    target:
      entity_id: "{{ target_boolean }}"
