blueprint:
  name: "Tag Reader → Input Boolean Toggle (bis zu 10 Karten)"
  description: >
    Hardware-Layer: schaltet (toggle) das passende input_boolean, abhängig davon,
    welche Karten-UID an welchem Reader gescannt wurde.

    Unterstützt 10 Karten-Slots. Karte 001 ist Pflicht, Karte 002-010 optional -
    einfach leer lassen, was nicht gebraucht wird.

    Vorgehensweise:
    1. Reader-Sensoren auswählen (MC, Reader 1, Reader 2).
    2. Pro Karte die UID eintragen und die zugehörigen input_booleans zuordnen.

  domain: automation

  input:
    reader_section:
      name: Reader-Sensoren
      icon: mdi:nfc-variant
      collapsed: false
      input:
        reader_mc:
          name: Tag Reader MC Sensor
          description: >
            Sensor des MC-Readers (Master Checkout). Der Sensor muss beim Scannen
            eines Tags als Zustand (State) die UID des Tags liefern.
          default: []
          selector:
            entity:
              filter:
                - domain: [sensor]
              multiple: false
        reader_1:
          name: Tag Reader 1 Sensor
          description: Sensor des ersten Stations-Readers (z.B. TR-K-01).
          default: []
          selector:
            entity:
              filter:
                - domain: [sensor]
              multiple: false
        reader_2:
          name: Tag Reader 2 Sensor
          description: Sensor des zweiten Stations-Readers (z.B. TR-K-02).
          default: []
          selector:
            entity:
              filter:
                - domain: [sensor]
              multiple: false

    karte1_section:
      name: Karte 001
      icon: mdi:card-account-details
      collapsed: false
      input:
        tag_1_uid:
          name: Tag 001 UID
          description: >
            Exakte UID der Karte, genau so wie sie der Reader-Sensor als State
            liefert (Groß-/Kleinschreibung beachten, keine Leerzeichen).
            Beispiel: 04A224B91C2A80
          default:
          selector:
            text:
        mc_tag1_boolean:
          name: Reader MC → Tag 001 Boolean
          default: []
          selector: { entity: { filter: [{ domain: input_boolean }] } }
        r1_tag1_boolean:
          name: Reader 1 → Tag 001 Boolean
          default: []
          selector: { entity: { filter: [{ domain: input_boolean }] } }
        r2_tag1_boolean:
          name: Reader 2 → Tag 001 Boolean
          default: []
          selector: { entity: { filter: [{ domain: input_boolean }] } }

    karte2_section:
      name: Karte 002 (optional)
      icon: mdi:card-account-details
      collapsed: false
      input:
        tag_2_uid:
          name: Tag 002 UID
          default:
          selector:
            text:
        mc_tag2_boolean:
          name: Reader MC → Tag 002 Boolean
          default: []
          selector: { entity: { filter: [{ domain: input_boolean }] } }
        r1_tag2_boolean:
          name: Reader 1 → Tag 002 Boolean
          default: []
          selector: { entity: { filter: [{ domain: input_boolean }] } }
        r2_tag2_boolean:
          name: Reader 2 → Tag 002 Boolean
          default: []
          selector: { entity: { filter: [{ domain: input_boolean }] } }

    karte3_section:
      name: Karte 003 (optional)
      icon: mdi:card-account-details
      collapsed: false
      input:
        tag_3_uid:
          name: Tag 003 UID
          default:
          selector:
            text:
        mc_tag3_boolean:
          name: Reader MC → Tag 003 Boolean
          default: []
          selector: { entity: { filter: [{ domain: input_boolean }] } }
        r1_tag3_boolean:
          name: Reader 1 → Tag 003 Boolean
          default: []
          selector: { entity: { filter: [{ domain: input_boolean }] } }
        r2_tag3_boolean:
          name: Reader 2 → Tag 003 Boolean
          default: []
          selector: { entity: { filter: [{ domain: input_boolean }] } }

    karte4_section:
      name: Karte 004 (optional)
      icon: mdi:card-account-details
      collapsed: true
      input:
        tag_4_uid: { name: Tag 004 UID, default: , selector: { text: } }
        mc_tag4_boolean: { name: Reader MC → Tag 004 Boolean, default: [], selector: { entity: { filter: [{ domain: input_boolean }] } } }
        r1_tag4_boolean: { name: Reader 1 → Tag 004 Boolean, default: [], selector: { entity: { filter: [{ domain: input_boolean }] } } }
        r2_tag4_boolean: { name: Reader 2 → Tag 004 Boolean, default: [], selector: { entity: { filter: [{ domain: input_boolean }] } } }

    karte5_section:
      name: Karte 005 (optional)
      icon: mdi:card-account-details
