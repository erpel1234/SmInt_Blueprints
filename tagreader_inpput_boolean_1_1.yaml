blueprint:
  name: "Tag Reader → Input Boolean Toggle (10 Reader × 10 Karten)"
  description: >
    Hardware-Layer: schaltet (toggle) das passende input_boolean, abhängig davon,
    welche Karten-UID an welchem Reader gescannt wurde.

    Eine einzige Automation für die gesamte Anlage: 1 Checkout-Reader (MC) plus
    bis zu 9 Stations-Reader, jeweils mit bis zu 10 Karten. Karte 001 und der
    MC-Reader sind Pflicht, alles andere ist optional - einfach leer lassen,
    was nicht gebraucht wird.

    Aufbau: pro Karte ein Abschnitt mit der UID und je einem input_boolean
    pro Reader. Ein leer gelassenes Feld bedeutet schlicht "diese Karte wird
    an diesem Reader nicht verwendet".

    Vorgehensweise:
    1. Im Abschnitt "Reader-Sensoren" die Sensoren aller Reader auswählen.
    2. Pro Karte die UID eintragen und die input_booleans der Reader zuordnen,
       an denen die Karte genutzt werden kann.

  domain: automation

  input:
    reader_section:
      name: Reader-Sensoren
      icon: mdi:nfc-variant
      collapsed: false
      input:
        reader_mc:
          name: Tag Reader MC Sensor
          description: >
            Sensor des MC-Readers (Master Checkout). Der Sensor muss beim Scannen eines Tags als Zustand (State) die UID des Tags liefern.
          default: []
          selector:
            entity:
              filter:
                - domain: [sensor]
              multiple: false
        reader_1:
          name: Tag Reader 1 Sensor
          description: >
            Sensor des Stations-Readers 1 (optional).
          default: []
          selector:
            entity:
              filter:
                - domain: [sensor]
              multiple: false
        reader_2:
          name: Tag Reader 2 Sensor
          description: >
            Sensor des Stations-Readers 2 (optional).
          default: []
          selector:
            entity:
              filter:
                - domain: [sensor]
              multiple: false
        reader_3:
          name: Tag Reader 3 Sensor
          description: >
            Sensor des Stations-Readers 3 (optional).
          default: []
          selector:
            entity:
              filter:
                - domain: [sensor]
              multiple: false
        reader_4:
          name: Tag Reader 4 Sensor
          description: >
            Sensor des Stations-Readers 4 (optional).
          default: []
          selector:
            entity:
              filter:
                - domain: [sensor]
              multiple: false
        reader_5:
          name: Tag Reader 5 Sensor
          description: >
            Sensor des Stations-Readers 5 (optional).
          default: []
          selector:
            entity:
              filter:
                - domain: [sensor]
              multiple: false
        reader_6:
          name: Tag Reader 6 Sensor
          description: >
            Sensor des Stations-Readers 6 (optional).
          default: []
          selector:
            entity:
              filter:
                - domain: [sensor]
              multiple: false
        reader_7:
          name: Tag Reader 7 Sensor
          description: >
            Sensor des Stations-Readers 7 (optional).
          default: []
          selector:
            entity:
              filter:
                - domain: [sensor]
              multiple: false
        reader_8:
          name: Tag Reader 8 Sensor
          description: >
            Sensor des Stations-Readers 8 (optional).
          default: []
          selector:
            entity:
              filter:
                - domain: [sensor]
              multiple: false
        reader_9:
          name: Tag Reader 9 Sensor
          description: >
            Sensor des Stations-Readers 9 (optional).
          default: []
          selector:
            entity:
              filter:
                - domain: [sensor]
              multiple: false

    karte1_section:
      name: Karte 001
      icon: mdi:card-account-details
      collapsed: false
      input:
        tag_1_uid:
          name: Tag 001 UID
          description: >
            Exakte UID der Karte, genau so wie sie der Reader-Sensor als State
            liefert (Groß-/Kleinschreibung beachten, keine Leerzeichen).
            Beispiele: 04A224B91C2A80 oder 13-CF-91-2A
          default:
          selector:
            text:
        mc_tag1_boolean: { name: "Reader MC → Tag 001 Boolean", default: [], selector: { entity: { filter: [{ domain: input_boolean }] } } }
        r1_tag1_boolean: { name: "Reader 1 → Tag 001 Boolean", default: [], selector: { entity: { filter: [{ domain: input_boolean }] } } }
