        tag_8_uid: { name: Tag 008 UID, default: , selector: { text: } }
        mc_tag8_boolean: { name: Reader MC → Tag 008 Boolean, default: [], selector: { entity: { filter: [{ domain: input_boolean }] } } }
        r1_tag8_boolean: { name: Reader 1 → Tag 008 Boolean, default: [], selector: { entity: { filter: [{ domain: input_boolean }] } } }
        r2_tag8_boolean: { name: Reader 2 → Tag 008 Boolean, default: [], selector: { entity: { filter: [{ domain: input_boolean }] } } }

    karte9_section:
      name: Karte 009 (optional)
