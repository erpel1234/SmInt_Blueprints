        - { uid: !input tag_10_uid, mc: !input mc_tag10_boolean, r1: !input r1_tag10_boolean, r2: !input r2_tag10_boolean, r3: !input r3_tag10_boolean, r4: !input r4_tag10_boolean, r5: !input r5_tag10_boolean, r6: !input r6_tag10_boolean, r7: !input r7_tag10_boolean, r8: !input r8_tag10_boolean, r9: !input r9_tag10_boolean }

  - variables:
      scanned: "{{ trigger.to_state.state | default('', true) }}"

  # Leere / ungültige Reader-States ignorieren (sonst würde ein leerer UID-Slot matchen)
  - condition: template
    value_template: "{{ scanned not in ['', 'unknown', 'unavailable', 'None', 'none'] }}"

  - variables:
      hit: "{{ cards | selectattr('uid', 'defined') | selectattr('uid', 'eq', scanned) | list }}"

  - condition: template
    value_template: "{{ hit | length > 0 }}"

  - variables:
      # trigger.id ist 'mc' / 'r1' ... 'r9' und zugleich der Schlüssel im Karten-Dict
      target_boolean: "{{ hit[0].get(trigger.id, '') }}"

  # Nicht konfigurierte Zuordnungen sind [] (leerer Entity-Selector) statt String -> überspringen
  - condition: template
    value_template: "{{ target_boolean is string and target_boolean | length > 0 }}"

  - action: input_boolean.toggle
    target:
      entity_id: "{{ target_boolean }}"
