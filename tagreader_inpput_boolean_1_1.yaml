      input:
        tag_5_uid: { name: Tag 005 UID, default: , selector: { text: } }
        mc_tag5_boolean: { name: Reader MC → Tag 005 Boolean, default: [], selector: { entity: { filter: [{ domain: input_boolean }] } } }
        r1_tag5_boolean: { name: Reader 1 → Tag 005 Boolean, default: [], selector: { entity: { filter: [{ domain: input_boolean }] } } }
