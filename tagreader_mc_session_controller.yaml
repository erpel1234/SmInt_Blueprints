blueprint:
  name: "SmInt MC Session Controller"
  description: >
    Ersetzt tagreader_mc_device_erzeugen.yaml + tagreader_ergaenzungunddasandere.yaml
    + die Namensgenerierung aus tagreader_generate_random_experiment_name.yaml.

    Bei MC-Boolean ON (Session-Start), garantierte Reihenfolge:
    1. Flush-Script (alten kWh-Wert vor dem Reset per MQTT publizieren)
    2. R1/R2 kWh-Speicher auf 0 zurücksetzen
    3. Neuen Zufalls-Experimentnamen generieren
    4. MQTT Startzeit publizieren
    5. ESPHome IN

    Bei MC-Boolean OFF (Checkout), garantierte Reihenfolge:
    1. MQTT Endzeit/kWh/CO2 publizieren
    2. R1/R2 Reader-Booleans aufräumen
    3. ESPHome OUT
    4. Display "abgeschlossen"
  domain: automation

  input:
    # --- Allgemein ---
    station_id:
      name: Station ID (Suffix für kwh_/co2_-Sensoren, z.B. "001")
      default: "001"
      selector:
        text: {}

    display_text:
      name: MC Display Input Text
      selector:
        entity:
          domain: input_text

    esphome_in_action:
      name: ESPHome IN Action (bei Session-Start)
      default: []
      selector:
        action: {}

    esphome_out_action:
      name: ESPHome OUT Action (bei Checkout)
      default: []
      selector:
        action: {}

    # --- TAG 1 ---
    mc_tag1_boolean:
      name: MC Tag 001 Boolean (Trigger)
      selector: { entity: { domain: input_boolean } }
    r1_tag1_boolean: { name: "R1 - Tag 001 Boolean", selector: { entity: { domain: input_boolean } } }
    r2_tag1_boolean: { name: "R2 - Tag 001 Boolean", selector: { entity: { domain: input_boolean } } }
    r1_tag1_number: { name: "R1 - Tag 001 kWh Speicher", selector: { entity: { domain: input_number } } }
    r2_tag1_number: { name: "R2 - Tag 001 kWh Speicher", selector: { entity: { domain: input_number } } }
    tag1_text_storage:
      name: Tag 001 Experiment Name (input_text)
      selector: { entity: { domain: input_text } }
    base_tag1:
      name: Tag 001 Basis-Name (input_text, vom Dashboard befüllt)
      selector: { entity: { domain: input_text } }
    tag1_kwh_sensor:
      name: Tag 001 Finaler kWh Sensor (sensor.final_kwh_tag...)
      selector: { entity: { domain: sensor } }
    tag1_co2_sensor:
      name: Tag 001 Finaler CO2 Sensor (sensor.final_co2_tag...)
      selector: { entity: { domain: sensor } }
    tag1_flush_script:
      name: Tag 001 Flush Script (Optional, publiziert alten kWh-Wert vor dem Reset)
      default: []
      selector: { action: {} }

    # --- TAG 2 ---
    mc_tag2_boolean:
      name: MC Tag 002 Boolean (Trigger)
      selector: { entity: { domain: input_boolean } }
    r1_tag2_boolean: { name: "R1 - Tag 002 Boolean", selector: { entity: { domain: input_boolean } } }
    r2_tag2_boolean: { name: "R2 - Tag 002 Boolean", selector: { entity: { domain: input_boolean } } }
    r1_tag2_number: { name: "R1 - Tag 002 kWh Speicher", selector: { entity: { domain: input_number } } }
    r2_tag2_number: { name: "R2 - Tag 002 kWh Speicher", selector: { entity: { domain: input_number } } }
    tag2_text_storage:
      name: Tag 002 Experiment Name (input_text)
      selector: { entity: { domain: input_text } }
    base_tag2:
      name: Tag 002 Basis-Name (input_text, vom Dashboard befüllt)
      selector: { entity: { domain: input_text } }
    tag2_kwh_sensor:
      name: Tag 002 Finaler kWh Sensor (sensor.final_kwh_tag...)
      selector: { entity: { domain: sensor } }
    tag2_co2_sensor:
      name: Tag 002 Finaler CO2 Sensor (sensor.final_co2_tag...)
      selector: { entity: { domain: sensor } }
    tag2_flush_script:
      name: Tag 002 Flush Script (Optional, publiziert alten kWh-Wert vor dem Reset)
      default: []
      selector: { action: {} }

    # --- TAG 3 ---
    mc_tag3_boolean:
      name: MC Tag 003 Boolean (Trigger)
      selector: { entity: { domain: input_boolean } }
    r1_tag3_boolean: { name: "R1 - Tag 003 Boolean", selector: { entity: { domain: input_boolean } } }
    r2_tag3_boolean: { name: "R2 - Tag 003 Boolean", selector: { entity: { domain: input_boolean } } }
    r1_tag3_number: { name: "R1 - Tag 003 kWh Speicher", selector: { entity: { domain: input_number } } }
    r2_tag3_number: { name: "R2 - Tag 003 kWh Speicher", selector: { entity: { domain: input_number } } }
    tag3_text_storage:
      name: Tag 003 Experiment Name (input_text)
      selector: { entity: { domain: input_text } }
    base_tag3:
      name: Tag 003 Basis-Name (input_text, vom Dashboard befüllt)
      selector: { entity: { domain: input_text } }
    tag3_kwh_sensor:
      name: Tag 003 Finaler kWh Sensor (sensor.final_kwh_tag...)
      selector: { entity: { domain: sensor } }
    tag3_co2_sensor:
      name: Tag 003 Finaler CO2 Sensor (sensor.final_co2_tag...)
      selector: { entity: { domain: sensor } }
    tag3_flush_script:
      name: Tag 003 Flush Script (Optional, publiziert alten kWh-Wert vor dem Reset)
      default: []
      selector: { action: {} }

mode: parallel

trigger:
  - platform: state
    entity_id: !input mc_tag1_boolean
    from: "off"
    to: "on"
    id: "Tag1_ON"
  - platform: state
    entity_id: !input mc_tag1_boolean
    from: "on"
    to: "off"
    id: "Tag1_OFF"
  - platform: state
    entity_id: !input mc_tag2_boolean
    from: "off"
    to: "on"
    id: "Tag2_ON"
  - platform: state
    entity_id: !input mc_tag2_boolean
    from: "on"
    to: "off"
    id: "Tag2_OFF"
  - platform: state
    entity_id: !input mc_tag3_boolean
    from: "off"
    to: "on"
    id: "Tag3_ON"
  - platform: state
    entity_id: !input mc_tag3_boolean
    from: "on"
    to: "off"
    id: "Tag3_OFF"

action:
  - variables:
      sid: !input station_id
      tag1_txt: !input tag1_text_storage
      tag1_base: !input base_tag1
      tag1_kwh: !input tag1_kwh_sensor
      tag1_co2: !input tag1_co2_sensor
      tag2_txt: !input tag2_text_storage
      tag2_base: !input base_tag2
      tag2_kwh: !input tag2_kwh_sensor
      tag2_co2: !input tag2_co2_sensor
      tag3_txt: !input tag3_text_storage
      tag3_base: !input base_tag3
      tag3_kwh: !input tag3_kwh_sensor
      tag3_co2: !input tag3_co2_sensor

  - choose:
      # ==========================================
      # TAG 1 - ON (Flush -> Reset -> Neuer Name -> Startzeit -> ESPHome IN)
      # ==========================================
      - conditions:
          - condition: trigger
            id: "Tag1_ON"
        sequence:
          - sequence: !input tag1_flush_script

          - action: input_number.set_value
            data: { value: 0 }
            target:
              entity_id:
                - !input r1_tag1_number
                - !input r2_tag1_number

          - variables:
              timestamp: "{{ now().strftime('%Y%m%d') }}"
              suffix: >
                {% set chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789' %}
                {% set code = namespace(val='') %}
                {% for _ in range(4) %}
                  {% set code.val = code.val + chars | random %}
                {% endfor %}
                {{ code.val }}
          - action: input_text.set_value
            target:
              entity_id: !input tag1_text_storage
            data:
              value: "{{ timestamp }}_{{ states(tag1_base) }}_{{ suffix }}"

          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag1_txt) }}/start_time/config"
              payload: >-
                {
                  "name": "01_Startzeitpunkt",
                  "state_topic": "homeassistant/sensor/{{ states(tag1_txt) }}/start_time/state",
                  "unique_id": "{{ states(tag1_txt) }}_start_time",
                  "device_class": "timestamp",
                  "device": { "identifiers": ["{{ states(tag1_txt) }}"] }
                }
              retain: true
          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag1_txt) }}/start_time/state"
              payload: "{{ now().isoformat() }}"
              retain: true

          - sequence: !input esphome_in_action

      # ==========================================
      # TAG 1 - OFF (Endzeit/kWh/CO2 -> Cleanup -> ESPHome OUT -> Display)
      # ==========================================
      - conditions:
          - condition: trigger
            id: "Tag1_OFF"
        sequence:
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag1_txt) }}/end_time/config"
              payload: >-
                {
                  "name": "02_Endzeitpunkt",
                  "state_topic": "homeassistant/sensor/{{ states(tag1_txt) }}/end_time/state",
                  "unique_id": "{{ states(tag1_txt) }}_end_time",
                  "device_class": "timestamp",
                  "device": { "identifiers": ["{{ states(tag1_txt) }}"] }
                }
              retain: true
          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag1_txt) }}/end_time/state"
              payload: "{{ now().isoformat() }}"
              retain: true

          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag1_txt) }}/kwh_{{ sid }}/config"
              payload: >-
                {
                  "name": "05_Stromverbrauch Gesamt",
                  "state_topic": "homeassistant/sensor/{{ states(tag1_txt) }}/kwh_{{ sid }}/state",
                  "unit_of_measurement": "kWh",
                  "device_class": "energy",
                  "state_class": "total",
                  "unique_id": "{{ states(tag1_txt) }}_kwh_{{ sid }}",
                  "device": { "identifiers": ["{{ states(tag1_txt) }}"] }
                }
              retain: true
          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag1_txt) }}/kwh_{{ sid }}/state"
              payload: "{{ states(tag1_kwh) }}"
              retain: true

          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag1_txt) }}/co2_{{ sid }}/config"
              payload: >-
                {
                  "name": "06_CO2 Äquivalent Gesamt",
                  "state_topic": "homeassistant/sensor/{{ states(tag1_txt) }}/co2_{{ sid }}/state",
                  "unit_of_measurement": "kg CO₂e",
                  "state_class": "total",
                  "unique_id": "{{ states(tag1_txt) }}_co2_{{ sid }}",
                  "device": { "identifiers": ["{{ states(tag1_txt) }}"] }
                }
              retain: true
          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag1_txt) }}/co2_{{ sid }}/state"
              payload: "{{ states(tag1_co2) }}"
              retain: true

          - if:
              - condition: state
                entity_id: !input r1_tag1_boolean
                state: "on"
            then:
              - action: input_boolean.turn_off
                target: { entity_id: !input r1_tag1_boolean }
          - if:
              - condition: state
                entity_id: !input r2_tag1_boolean
                state: "on"
            then:
              - action: input_boolean.turn_off
                target: { entity_id: !input r2_tag1_boolean }

          - sequence: !input esphome_out_action

          - action: input_text.set_value
            target: { entity_id: !input display_text }
            data:
              value: "{{ states(tag1_txt) }} abgeschlossen!"

      # ==========================================
      # TAG 2 - ON
      # ==========================================
      - conditions:
          - condition: trigger
            id: "Tag2_ON"
        sequence:
          - sequence: !input tag2_flush_script

          - action: input_number.set_value
            data: { value: 0 }
            target:
              entity_id:
                - !input r1_tag2_number
                - !input r2_tag2_number

          - variables:
              timestamp: "{{ now().strftime('%Y%m%d') }}"
              suffix: >
                {% set chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789' %}
                {% set code = namespace(val='') %}
                {% for _ in range(4) %}
                  {% set code.val = code.val + chars | random %}
                {% endfor %}
                {{ code.val }}
          - action: input_text.set_value
            target:
              entity_id: !input tag2_text_storage
            data:
              value: "{{ timestamp }}_{{ states(tag2_base) }}_{{ suffix }}"

          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag2_txt) }}/start_time/config"
              payload: >-
                {
                  "name": "01_Startzeitpunkt",
                  "state_topic": "homeassistant/sensor/{{ states(tag2_txt) }}/start_time/state",
                  "unique_id": "{{ states(tag2_txt) }}_start_time",
                  "device_class": "timestamp",
                  "device": { "identifiers": ["{{ states(tag2_txt) }}"] }
                }
              retain: true
          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag2_txt) }}/start_time/state"
              payload: "{{ now().isoformat() }}"
              retain: true

          - sequence: !input esphome_in_action

      # ==========================================
      # TAG 2 - OFF
      # ==========================================
      - conditions:
          - condition: trigger
            id: "Tag2_OFF"
        sequence:
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag2_txt) }}/end_time/config"
              payload: >-
                {
                  "name": "02_Endzeitpunkt",
                  "state_topic": "homeassistant/sensor/{{ states(tag2_txt) }}/end_time/state",
                  "unique_id": "{{ states(tag2_txt) }}_end_time",
                  "device_class": "timestamp",
                  "device": { "identifiers": ["{{ states(tag2_txt) }}"] }
                }
              retain: true
          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag2_txt) }}/end_time/state"
              payload: "{{ now().isoformat() }}"
              retain: true

          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag2_txt) }}/kwh_{{ sid }}/config"
              payload: >-
                {
                  "name": "05_Stromverbrauch Gesamt",
                  "state_topic": "homeassistant/sensor/{{ states(tag2_txt) }}/kwh_{{ sid }}/state",
                  "unit_of_measurement": "kWh",
                  "device_class": "energy",
                  "state_class": "total",
                  "unique_id": "{{ states(tag2_txt) }}_kwh_{{ sid }}",
                  "device": { "identifiers": ["{{ states(tag2_txt) }}"] }
                }
              retain: true
          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag2_txt) }}/kwh_{{ sid }}/state"
              payload: "{{ states(tag2_kwh) }}"
              retain: true

          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag2_txt) }}/co2_{{ sid }}/config"
              payload: >-
                {
                  "name": "06_CO2 Äquivalent Gesamt",
                  "state_topic": "homeassistant/sensor/{{ states(tag2_txt) }}/co2_{{ sid }}/state",
                  "unit_of_measurement": "kg CO₂e",
                  "state_class": "total",
                  "unique_id": "{{ states(tag2_txt) }}_co2_{{ sid }}",
                  "device": { "identifiers": ["{{ states(tag2_txt) }}"] }
                }
              retain: true
          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag2_txt) }}/co2_{{ sid }}/state"
              payload: "{{ states(tag2_co2) }}"
              retain: true

          - if:
              - condition: state
                entity_id: !input r1_tag2_boolean
                state: "on"
            then:
              - action: input_boolean.turn_off
                target: { entity_id: !input r1_tag2_boolean }
          - if:
              - condition: state
                entity_id: !input r2_tag2_boolean
                state: "on"
            then:
              - action: input_boolean.turn_off
                target: { entity_id: !input r2_tag2_boolean }

          - sequence: !input esphome_out_action

          - action: input_text.set_value
            target: { entity_id: !input display_text }
            data:
              value: "{{ states(tag2_txt) }} abgeschlossen!"

      # ==========================================
      # TAG 3 - ON
      # ==========================================
      - conditions:
          - condition: trigger
            id: "Tag3_ON"
        sequence:
          - sequence: !input tag3_flush_script

          - action: input_number.set_value
            data: { value: 0 }
            target:
              entity_id:
                - !input r1_tag3_number
                - !input r2_tag3_number

          - variables:
              timestamp: "{{ now().strftime('%Y%m%d') }}"
              suffix: >
