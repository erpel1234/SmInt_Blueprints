              payload: "{{ states(tag3_kwh) }}"
              retain: true

          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(tag3_txt) }}/co2_{{ sid }}/config"
              payload: >-
