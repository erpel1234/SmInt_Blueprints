blueprint:
  name: "SmInt MC Session Controller (bis zu 10 Karten, beliebig viele Stations-Reader)"
  description: >
    Globale Session-Steuerung, 1x instanziieren.

    Bei MC-Boolean ON (Session-Start), garantierte Reihenfolge:
    1. Flush-Script (alten kWh-Wert vor dem Reset per MQTT publizieren)
    2. kWh-Speicher aller Stations-Reader dieser Karte auf 0 zurücksetzen
    3. Neuen Zufalls-Experimentnamen generieren
    4. MQTT Startzeit publizieren
    5. ESPHome IN

    Bei MC-Boolean OFF (Checkout), garantierte Reihenfolge:
    1. Reader-Booleans aller Stationen dieser Karte aufräumen (triggert den
       Reader Session Handler, der den letzten Messwert noch einträgt)
    2. 1s warten
    3. MQTT Endzeit/kWh/CO2 publizieren
    4. ESPHome OUT
    5. Display "abgeschlossen"

    KARTEN: 10 Karten-Slots. Karte 001 ist Pflicht, Karte 002-010 optional -
    einfach leer lassen, was nicht gebraucht wird.

    STATIONS-READER: Pro Karte gibt es zwei Mehrfachauswahl-Felder - die
    Reader-Booleans und die kWh-Speicher aller Stationen, an denen diese Karte
    genutzt werden kann. Damit sind beliebig viele Stationen möglich. Wichtig:
    beide Listen müssen vollständig sein, sonst bleiben beim Checkout Booleans
    hängen bzw. laufen alte kWh-Werte in die nächste Session weiter.
  domain: automation

  input:
    # --- Allgemein ---
    allgemein_section:
      name: Allgemein
      icon: mdi:cog
      collapsed: false
      input:
        station_id:
          name: Station ID (Suffix für kwh_/co2_-Sensoren, z.B. "001")
          default: "001"
          selector:
            text: {}
        display_text:
          name: MC Display Input Text
          selector:
            entity:
              domain: input_text
        esphome_in_action:
          name: ESPHome IN Action (bei Session-Start)
          default: []
          selector:
            action: {}
        esphome_out_action:
          name: ESPHome OUT Action (bei Checkout)
          default: []
          selector:
            action: {}

    # --- Karte 1 (Pflicht) ---
    karte1_section:
      name: Karte 001
      icon: mdi:card-account-details
      collapsed: false
      input:
        mc_tag1_boolean:
          name: MC Tag 001 Boolean (Trigger)
          selector: { entity: { domain: input_boolean } }
        tag1_reader_booleans:
          name: "Tag 001 - Reader-Booleans (alle Stationen)"
          description: >
            Alle Stations-Booleans dieser Karte, z.B.
            input_boolean.tr_k_01_switch_tag001 und tr_k_02_switch_tag001.
            Werden beim MC-Checkout ausgeschaltet - fehlt einer, bleibt er
            hängen und sein letzter Messwert fehlt in der Session.
          default: []
          selector: { entity: { filter: [{ domain: input_boolean }], multiple: true } }
        tag1_reader_numbers:
          name: "Tag 001 - kWh-Speicher (alle Stationen)"
          description: >
            Alle input_number dieser Karte, z.B.
            input_number.tr_k_01_kwh_um_added_tag001. Werden beim
            Session-Start auf 0 gesetzt.
          default: []
          selector: { entity: { filter: [{ domain: input_number }], multiple: true } }
        tag1_text_storage:
          name: Tag 001 Experiment Name (input_text)
          selector: { entity: { domain: input_text } }
        base_tag1:
          name: Tag 001 Basis-Name (input_text, vom Dashboard befüllt)
          selector: { entity: { domain: input_text } }
        tag1_kwh_sensor:
          name: Tag 001 Finaler kWh Sensor (sensor.final_kwh_tag...)
          selector: { entity: { domain: sensor } }
        tag1_co2_sensor:
          name: Tag 001 Finaler CO2 Sensor (sensor.final_co2_tag...)
          selector: { entity: { domain: sensor } }
        tag1_flush_script:
          name: Tag 001 Flush Script (Optional, publiziert alten kWh-Wert vor dem Reset)
          default: []
          selector: { action: {} }

    # --- Karte 2 (optional) ---
    karte2_section:
      name: Karte 002 (optional)
      icon: mdi:card-account-details
      collapsed: false
      input:
        mc_tag2_boolean:
          name: MC Tag 002 Boolean (Trigger)
          default: []
          selector: { entity: { domain: input_boolean } }
        tag2_reader_booleans:
          name: "Tag 002 - Reader-Booleans (alle Stationen)"
          default: []
          selector: { entity: { filter: [{ domain: input_boolean }], multiple: true } }
        tag2_reader_numbers:
          name: "Tag 002 - kWh-Speicher (alle Stationen)"
          default: []
          selector: { entity: { filter: [{ domain: input_number }], multiple: true } }
        tag2_text_storage:
          name: Tag 002 Experiment Name (input_text)
          default: []
          selector: { entity: { domain: input_text } }
        base_tag2:
          name: Tag 002 Basis-Name (input_text, vom Dashboard befüllt)
          default: []
          selector: { entity: { domain: input_text } }
        tag2_kwh_sensor:
          name: Tag 002 Finaler kWh Sensor (sensor.final_kwh_tag...)
          default: []
          selector: { entity: { domain: sensor } }
        tag2_co2_sensor:
          name: Tag 002 Finaler CO2 Sensor (sensor.final_co2_tag...)
          default: []
          selector: { entity: { domain: sensor } }
        tag2_flush_script:
          name: Tag 002 Flush Script (Optional, publiziert alten kWh-Wert vor dem Reset)
          default: []
          selector: { action: {} }

    # --- Karte 3 (optional) ---
    karte3_section:
      name: Karte 003 (optional)
      icon: mdi:card-account-details
      collapsed: false
      input:
        mc_tag3_boolean:
          name: MC Tag 003 Boolean (Trigger)
          default: []
          selector: { entity: { domain: input_boolean } }
        tag3_reader_booleans:
          name: "Tag 003 - Reader-Booleans (alle Stationen)"
          default: []
          selector: { entity: { filter: [{ domain: input_boolean }], multiple: true } }
        tag3_reader_numbers:
          name: "Tag 003 - kWh-Speicher (alle Stationen)"
          default: []
          selector: { entity: { filter: [{ domain: input_number }], multiple: true } }
        tag3_text_storage:
          name: Tag 003 Experiment Name (input_text)
          default: []
          selector: { entity: { domain: input_text } }
        base_tag3:
          name: Tag 003 Basis-Name (input_text, vom Dashboard befüllt)
          default: []
          selector: { entity: { domain: input_text } }
        tag3_kwh_sensor:
          name: Tag 003 Finaler kWh Sensor (sensor.final_kwh_tag...)
          default: []
          selector: { entity: { domain: sensor } }
        tag3_co2_sensor:
          name: Tag 003 Finaler CO2 Sensor (sensor.final_co2_tag...)
          default: []
          selector: { entity: { domain: sensor } }
        tag3_flush_script:
          name: Tag 003 Flush Script (Optional, publiziert alten kWh-Wert vor dem Reset)
          default: []
          selector: { action: {} }

    # --- Karte 4-10 (optional, gleiches Schema) ---
    karte4_section:
      name: Karte 004 (optional)
      icon: mdi:card-account-details
      collapsed: true
      input:
        mc_tag4_boolean: { name: MC Tag 004 Boolean (Trigger), default: [], selector: { entity: { domain: input_boolean } } }
        tag4_reader_booleans: { name: "Tag 004 - Reader-Booleans (alle Stationen)", default: [], selector: { entity: { filter: [{ domain: input_boolean }], multiple: true } } }
        tag4_reader_numbers: { name: "Tag 004 - kWh-Speicher (alle Stationen)", default: [], selector: { entity: { filter: [{ domain: input_number }], multiple: true } } }
        tag4_text_storage: { name: Tag 004 Experiment Name (input_text), default: [], selector: { entity: { domain: input_text } } }
        base_tag4: { name: Tag 004 Basis-Name (input_text), default: [], selector: { entity: { domain: input_text } } }
        tag4_kwh_sensor: { name: Tag 004 Finaler kWh Sensor, default: [], selector: { entity: { domain: sensor } } }
        tag4_co2_sensor: { name: Tag 004 Finaler CO2 Sensor, default: [], selector: { entity: { domain: sensor } } }
        tag4_flush_script: { name: Tag 004 Flush Script (Optional), default: [], selector: { action: {} } }

    karte5_section:
