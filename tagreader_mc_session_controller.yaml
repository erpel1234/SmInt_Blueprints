mode: parallel
max: 25

trigger:
  - platform: state
    entity_id: !input mc_tag1_boolean
    from: "off"
    to: "on"
    id: "ON"
  - platform: state
    entity_id: !input mc_tag1_boolean
    from: "on"
    to: "off"
    id: "OFF"
  - platform: state
    entity_id: !input mc_tag2_boolean
    from: "off"
    to: "on"
    id: "ON"
  - platform: state
    entity_id: !input mc_tag2_boolean
    from: "on"
    to: "off"
    id: "OFF"
  - platform: state
    entity_id: !input mc_tag3_boolean
    from: "off"
    to: "on"
    id: "ON"
  - platform: state
    entity_id: !input mc_tag3_boolean
    from: "on"
    to: "off"
    id: "OFF"
  - platform: state
    entity_id: !input mc_tag4_boolean
    from: "off"
    to: "on"
    id: "ON"
  - platform: state
    entity_id: !input mc_tag4_boolean
    from: "on"
    to: "off"
    id: "OFF"
  - platform: state
    entity_id: !input mc_tag5_boolean
    from: "off"
    to: "on"
    id: "ON"
  - platform: state
    entity_id: !input mc_tag5_boolean
    from: "on"
    to: "off"
    id: "OFF"
  - platform: state
    entity_id: !input mc_tag6_boolean
    from: "off"
    to: "on"
    id: "ON"
  - platform: state
    entity_id: !input mc_tag6_boolean
    from: "on"
    to: "off"
    id: "OFF"
  - platform: state
    entity_id: !input mc_tag7_boolean
    from: "off"
    to: "on"
    id: "ON"
  - platform: state
    entity_id: !input mc_tag7_boolean
    from: "on"
    to: "off"
    id: "OFF"
  - platform: state
    entity_id: !input mc_tag8_boolean
    from: "off"
    to: "on"
    id: "ON"
  - platform: state
    entity_id: !input mc_tag8_boolean
    from: "on"
    to: "off"
    id: "OFF"
  - platform: state
    entity_id: !input mc_tag9_boolean
    from: "off"
    to: "on"
    id: "ON"
  - platform: state
    entity_id: !input mc_tag9_boolean
    from: "on"
    to: "off"
    id: "OFF"
  - platform: state
    entity_id: !input mc_tag10_boolean
    from: "off"
    to: "on"
    id: "ON"
  - platform: state
    entity_id: !input mc_tag10_boolean
    from: "on"
    to: "off"
    id: "OFF"

action:
  - variables:
      sid: !input station_id
      tag_defs:
        - { label: "001", mc: !input mc_tag1_boolean, rb: !input tag1_reader_booleans, rn: !input tag1_reader_numbers, text: !input tag1_text_storage, base: !input base_tag1, kwh: !input tag1_kwh_sensor, co2: !input tag1_co2_sensor }
        - { label: "002", mc: !input mc_tag2_boolean, rb: !input tag2_reader_booleans, rn: !input tag2_reader_numbers, text: !input tag2_text_storage, base: !input base_tag2, kwh: !input tag2_kwh_sensor, co2: !input tag2_co2_sensor }
        - { label: "003", mc: !input mc_tag3_boolean, rb: !input tag3_reader_booleans, rn: !input tag3_reader_numbers, text: !input tag3_text_storage, base: !input base_tag3, kwh: !input tag3_kwh_sensor, co2: !input tag3_co2_sensor }
        - { label: "004", mc: !input mc_tag4_boolean, rb: !input tag4_reader_booleans, rn: !input tag4_reader_numbers, text: !input tag4_text_storage, base: !input base_tag4, kwh: !input tag4_kwh_sensor, co2: !input tag4_co2_sensor }
        - { label: "005", mc: !input mc_tag5_boolean, rb: !input tag5_reader_booleans, rn: !input tag5_reader_numbers, text: !input tag5_text_storage, base: !input base_tag5, kwh: !input tag5_kwh_sensor, co2: !input tag5_co2_sensor }
        - { label: "006", mc: !input mc_tag6_boolean, rb: !input tag6_reader_booleans, rn: !input tag6_reader_numbers, text: !input tag6_text_storage, base: !input base_tag6, kwh: !input tag6_kwh_sensor, co2: !input tag6_co2_sensor }
        - { label: "007", mc: !input mc_tag7_boolean, rb: !input tag7_reader_booleans, rn: !input tag7_reader_numbers, text: !input tag7_text_storage, base: !input base_tag7, kwh: !input tag7_kwh_sensor, co2: !input tag7_co2_sensor }
        - { label: "008", mc: !input mc_tag8_boolean, rb: !input tag8_reader_booleans, rn: !input tag8_reader_numbers, text: !input tag8_text_storage, base: !input base_tag8, kwh: !input tag8_kwh_sensor, co2: !input tag8_co2_sensor }
        - { label: "009", mc: !input mc_tag9_boolean, rb: !input tag9_reader_booleans, rn: !input tag9_reader_numbers, text: !input tag9_text_storage, base: !input base_tag9, kwh: !input tag9_kwh_sensor, co2: !input tag9_co2_sensor }
        - { label: "010", mc: !input mc_tag10_boolean, rb: !input tag10_reader_booleans, rn: !input tag10_reader_numbers, text: !input tag10_text_storage, base: !input base_tag10, kwh: !input tag10_kwh_sensor, co2: !input tag10_co2_sensor }

  - variables:
      this_tag: "{{ (tag_defs | selectattr('mc', 'eq', trigger.entity_id) | list | first) | default({}, true) }}"

  # Sicherheitsnetz: ohne passenden Karten-Eintrag lieber abbrechen als mit
  # Undefined weiterlaufen.
  - condition: template
    value_template: "{{ this_tag | length > 0 }}"

  - variables:
      # Mehrfachauswahl liefert bereits eine Liste, ein leeres Feld liefert [].
      r_booleans: "{{ this_tag.rb | default([], true) | list }}"
      r_numbers: "{{ this_tag.rn | default([], true) | list }}"
      txt: "{{ this_tag.text }}"

  - choose:
      # ==========================================
      # ON: Flush -> Reset -> Neuer Name -> Startzeit -> ESPHome IN
      # ==========================================
      - conditions:
          - condition: trigger
            id: "ON"
        sequence:
          # 1. Flush-Script der jeweiligen Karte (action-Selektoren sind nicht
          #    template-fähig, deshalb ein Zweig pro Karten-Slot).
          - choose:
              - conditions: "{{ this_tag.label == '001' }}"
                sequence:
                  - sequence: !input tag1_flush_script
              - conditions: "{{ this_tag.label == '002' }}"
                sequence:
                  - sequence: !input tag2_flush_script
              - conditions: "{{ this_tag.label == '003' }}"
                sequence:
                  - sequence: !input tag3_flush_script
              - conditions: "{{ this_tag.label == '004' }}"
                sequence:
                  - sequence: !input tag4_flush_script
              - conditions: "{{ this_tag.label == '005' }}"
                sequence:
                  - sequence: !input tag5_flush_script
              - conditions: "{{ this_tag.label == '006' }}"
                sequence:
                  - sequence: !input tag6_flush_script
              - conditions: "{{ this_tag.label == '007' }}"
                sequence:
                  - sequence: !input tag7_flush_script
              - conditions: "{{ this_tag.label == '008' }}"
                sequence:
                  - sequence: !input tag8_flush_script
              - conditions: "{{ this_tag.label == '009' }}"
                sequence:
                  - sequence: !input tag9_flush_script
              - conditions: "{{ this_tag.label == '010' }}"
                sequence:
                  - sequence: !input tag10_flush_script

          # 2. kWh-Speicher aller Stationen dieser Karte auf 0
          - if: "{{ r_numbers | length > 0 }}"
            then:
              - action: input_number.set_value
                data: { value: 0 }
                target:
                  entity_id: "{{ r_numbers }}"

          # 3. Neuen Zufallsnamen generieren
          - variables:
              new_experiment_name: >-
                {% set chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789' %}
                {% set code = namespace(val='') %}
                {% for _ in range(4) %}
                  {% set code.val = code.val + chars | random %}
                {% endfor %}
                {{ now().strftime('%Y%m%d') }}_{{ states(this_tag.base) }}_{{ code.val }}
          - action: input_text.set_value
            target:
              entity_id: "{{ txt }}"
            data:
              value: "{{ new_experiment_name | trim }}"

          # 4. MQTT Startzeit
          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(txt) }}/start_time/config"
              payload: >-
                {
                  "name": "01_Startzeitpunkt",
                  "state_topic": "homeassistant/sensor/{{ states(txt) }}/start_time/state",
                  "unique_id": "{{ states(txt) }}_start_time",
                  "device_class": "timestamp",
                  "device": { "identifiers": ["{{ states(txt) }}"] }
                }
              retain: true
          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(txt) }}/start_time/state"
              payload: "{{ now().isoformat() }}"
              retain: true

          # 5. ESPHome IN
          - sequence: !input esphome_in_action

      # ==========================================
      # OFF: Cleanup -> Endzeit/kWh/CO2 -> ESPHome OUT -> Display
      # ==========================================
      - conditions:
          - condition: trigger
            id: "OFF"
        sequence:
          # 1. Reader-Booleans aller Stationen ausschalten (triggert den Reader
          #    Session Handler, der den letzten Messwert noch aufaddiert)
          - if: "{{ r_booleans | length > 0 }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ r_booleans }}"
          - delay: { seconds: 1 }

          # 2. Endzeit
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(txt) }}/end_time/config"
              payload: >-
                {
                  "name": "02_Endzeitpunkt",
                  "state_topic": "homeassistant/sensor/{{ states(txt) }}/end_time/state",
                  "unique_id": "{{ states(txt) }}_end_time",
                  "device_class": "timestamp",
                  "device": { "identifiers": ["{{ states(txt) }}"] }
                }
              retain: true
          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(txt) }}/end_time/state"
              payload: "{{ now().isoformat() }}"
              retain: true

          # 3. Gesamt-kWh
          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(txt) }}/kwh_{{ sid }}/config"
              payload: >-
                {
                  "name": "05_Stromverbrauch Gesamt",
                  "state_topic": "homeassistant/sensor/{{ states(txt) }}/kwh_{{ sid }}/state",
                  "unit_of_measurement": "kWh",
                  "device_class": "energy",
                  "state_class": "total",
                  "unique_id": "{{ states(txt) }}_kwh_{{ sid }}",
                  "device": { "identifiers": ["{{ states(txt) }}"] }
                }
              retain: true
          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(txt) }}/kwh_{{ sid }}/state"
              payload: "{{ states(this_tag.kwh) }}"
              retain: true

          # 4. CO2
          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(txt) }}/co2_{{ sid }}/config"
              payload: >-
                {
                  "name": "06_CO2 Äquivalent Gesamt",
                  "state_topic": "homeassistant/sensor/{{ states(txt) }}/co2_{{ sid }}/state",
                  "unit_of_measurement": "kg CO₂e",
                  "state_class": "total",
                  "unique_id": "{{ states(txt) }}_co2_{{ sid }}",
                  "device": { "identifiers": ["{{ states(txt) }}"] }
                }
              retain: true
          - delay: { seconds: 1 }
          - action: mqtt.publish
            data:
              topic: "homeassistant/sensor/{{ states(txt) }}/co2_{{ sid }}/state"
              payload: "{{ states(this_tag.co2) }}"
              retain: true

          # 5. ESPHome OUT + Display
          - sequence: !input esphome_out_action

          - action: input_text.set_value
            target: { entity_id: !input display_text }
            data:
              value: "{{ states(txt) }} abgeschlossen!"
