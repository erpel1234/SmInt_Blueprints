      icon: mdi:card-account-details
      collapsed: true
      input:
        mc_tag5_boolean: { name: MC Tag 005 Boolean (Trigger), default: [], selector: { entity: { domain: input_boolean } } }
        tag5_reader_booleans: { name: "Tag 005 - Reader-Booleans (alle Stationen)", default: [], selector: { entity: { filter: [{ domain: input_boolean }], multiple: true } } }
        tag5_reader_numbers: { name: "Tag 005 - kWh-Speicher (alle Stationen)", default: [], selector: { entity: { filter: [{ domain: input_number }], multiple: true } } }
